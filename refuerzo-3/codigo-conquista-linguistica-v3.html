úsica, árbol, papel"], "k": 0, "why": "CÉS-ped, e-XA-men, a-ZÚ-car.", "t": 15}, {"cat": "Tildes", "q": "¿Qué palabra aguda no necesita tilde?", "opts": ["reloj", "compás", "sofá"], "k": 0, "why": "Termina en j.", "t": 10}, {"cat": "Tildes", "q": "Elige la forma correcta.", "opts": ["exámen", "examen", "examén"], "k": 1, "why": "Llana terminada en n.", "t": 10}, {"cat": "Tildes", "q": "Elige la forma correcta.", "opts": ["jovenes", "jóvenés", "jóvenes"], "k": 2, "why": "Esdrújula.", "t": 10}, {"cat": "Tildes", "q": "¿Por qué lleva tilde «lápiz»?", "opts": ["Llana terminada en consonante distinta de n o s", "Aguda terminada en z", "Esdrújula"], "k": 0, "why": "LÁ-piz.", "t": 10}, {"cat": "Tildes", "q": "¿Qué palabra necesita tilde?", "opts": ["pared", "facil", "reloj"], "k": 1, "why": "Fácil.", "t": 10}, {"cat": "Tildes", "q": "¿Cuál es correcta?", "opts": ["órden", "ordén", "orden"], "k": 2, "why": "Llana terminada en n.", "t": 10}, {"cat": "Tildes", "q": "Completa: No sé ___ viene.", "opts": ["quién", "quien", "quiénes"], "k": 0, "why": "Interrogativo indirecto singular.", "t": 10}, {"cat": "Tildes", "q": "Completa: ___ tienes razón.", "opts": ["Tu", "Tú", "Túu"], "k": 1, "why": "Pronombre personal.", "t": 10}, {"cat": "Tildes", "q": "Completa: Quiero ___ agua.", "opts": ["mas", "màs", "más"], "k": 2, "why": "Adverbio de cantidad.", "t": 10}, {"cat": "Tildes", "q": "Completa: Espero que me ___ una respuesta.", "opts": ["dé", "de", "dè"], "k": 0, "why": "Verbo dar.", "t": 10}, {"cat": "Tildes", "q": "Completa: El regalo es para ___.", "opts": ["mi", "mí", "mì"], "k": 1, "why": "Pronombre personal.", "t": 10}, {"cat": "Tildes", "q": "Completa: No sé ___ hacerlo.", "opts": ["como", "comó", "cómo"], "k": 2, "why": "Interrogativo indirecto.", "t": 10}, {"cat": "Tildes", "q": "¿Qué palabra necesita tilde por hiato?", "opts": ["raiz", "ciudad", "reloj"], "k": 0, "why": "Raíz: vocal cerrada tónica junto a vocal abierta.", "t": 10}, {"cat": "Tildes", "q": "¿Cuál es correcta?  "Voy ___ la película.", "opts": ["haber", "a ber", "a ver"], "k": 2, "why": "A ver: preposición y verbo ver.", "t": 10}, {"cat": "Homófonas", "q": "Tiene que ___ una solución.", "opts": ["haber", "a ver", "aver"], "k": 0, "why": "Infinitivo haber.", "t": 10}, {"cat": "Homófonas", "q": "Ya he ___ los deberes.", "opts": ["echo", "hecho", "hechoo"], "k": 1, "why": "Participio de hacer.", "t": 10}, {"cat": "Homófonas", "q": "Siempre ___ sal a la sopa.", "opts": ["hecho", "hechó", "echo"], "k": 2, "why": "Del verbo echar.", "t": 10}, {"cat": "Homófonas", "q": "¡___ qué sorpresa!", "opts": ["Vaya", "Valla", "Baya"], "k": 0, "why": "Vaya, interjección.", "t": 10}, {"cat": "Homófonas", "q": "La ___ es un fruto carnoso.", "opts": ["valla", "baya", "vaya"], "k": 1, "why": "Baya.", "t": 10}, {"cat": "Homófonas", "q": "El alumno ___ una idea.", "opts": ["tubo", "tubó", "tuvo"], "k": 2, "why": "Tuvo, del verbo tener.", "t": 10}, {"cat": "Homófonas", "q": "El agua circula por un ___.", "opts": ["tubo", "tuvo", "túbo"], "k": 0, "why": "Tubo, pieza hueca.", "t": 10}, {"cat": "Homófonas", "q": "Completa: El fontanero cambió el ___; ayer ___ una avería.", "opts": ["tubo / tuvo", "tuvo / tubo", "tubo / tubo"], "k": 0, "why": "Tubo es sustantivo; tuvo pertenece a tener.", "t": 15}, {"cat": "Homófonas", "q": "El fotógrafo va a ___ las fotos.", "opts": ["rebelar", "revelár", "revelar"], "k": 2, "why": "Revelar.", "t": 10}, {"cat": "Homófonas", "q": "El pueblo se va a ___ contra el tirano.", "opts": ["rebelar", "revelar", "rebelár"], "k": 0, "why": "Rebelarse: sublevarse.", "t": 10}, {"cat": "Homófonas", "q": "El campo se cubrió de ___.", "opts": ["yerva", "hierba", "hierva"], "k": 1, "why": "Hierba: planta.", "t": 10}, {"cat": "Homófonas", "q": "Espera a que ___ el agua.", "opts": ["hierba", "yerva", "hierva"], "k": 2, "why": "Hierva, de hervir.", "t": 10}, {"cat": "Homófonas", "q": "La ___ del mar llegó a la arena.", "opts": ["ola", "hola", "óla"], "k": 0, "why": "Ola del mar.", "t": 1 const $=id=>document.getElementById(id),palette=['#3276ce','#cf4055','#258b69','#ae7b12','#8654c6','#c65a22','#657c91'],labels=['Azul','Rojo','Verde','Dorado','Violeta','Naranja','Gris'];
let colors=palette.slice(0,4),names=labels.slice(0,4),board,deck,turn,active,round,slot,q,phase,rebote,clock,delay,deadline,excluded;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function stop(){clearInterval(clock);clearTimeout(delay)}
function init(){stop();board=Array(32).fill(-1);deck=shuffle([...bank]);turn=active=round=0;phase='board';slot=-1;$('overlay').hidden=true;$('result').textContent='';render()}
function render(){ $('teams').replaceChildren();names.forEach((n,i)=>{let d=document.createElement('div');d.className='team'+(i===active?' active':'');d.style.setProperty('--team',colors[i]);let inp=document.createElement('input');inp.value=n;inp.disabled=round>0||phase!=='board';inp.onchange=()=>{names[i]=inp.value.trim()||labels[i];render()};let sel=document.createElement('select');sel.disabled=inp.disabled;palette.forEach((p,j)=>{let o=new Option(labels[j],p);o.selected=p===colors[i];o.disabled=colors.includes(p)&&p!==colors[i];sel.add(o)});sel.onchange=()=>{colors[i]=sel.value;render()};let score=document.createElement('strong');score.textContent=board.filter(v=>v===i).length;d.append(inp,sel,score);$('teams').append(d)});$('turn').textContent=phase==='end'?'PARTIDA TERMINADA':'TURNO · '+names[active];$('turn').style.color=colors[active];$('round').textContent=round+' / 32 turnos';$('board').replaceChildren();board.forEach((v,i)=>{let b=document.createElement('button');b.className='tile'+(v>=0?' owned':'');b.textContent=i+1;b.disabled=v>=0||phase!=='board';if(v>=0)b.style.setProperty('--owner',colors[v]);b.onclick=()=>pick(i);$('board').append(b)})}
function pick(i){if(phase!=='board'||board[i]>=0)return;slot=i;let src=deck.pop(),order=shuffle([0,1,2]);q={...src,opts:order.map(j=>src.opts[j]),k:order.indexOf(src.k)};active=turn;rebote=false;excluded=-1;$('overlay').hidden=false;$('category').textContent='CASILLA '+(i+1)+' · '+q.cat;$('question').textContent=q.q;begin()}

function answer(j){if(phase!=='answer')return;stop();phase='feedback';let buttons=[...$('options').children];buttons.forEach(b=>b.disabled=true);if(j===q.k){board[slot]=active;finish('¡Correcto! Casilla para '+names[active]);return}if(j>=0){buttons[j].classList.add('fail');excluded=j}if(!rebote){let choices=[0,1,2,3].filter(i=>i!==turn);active=choices[Math.floor(Math.random()*choices.length)];rebote=true;$('notice').textContent=(j<0?'¡Tiempo!':'Incorrecta.')+' Rebote para '+names[active];delay=setTimeout(begin,1300)}else finish('Sin conquista. La casilla queda libre.')}
